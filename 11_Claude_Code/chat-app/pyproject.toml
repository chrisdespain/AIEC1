[project]
name = "chat-app"
version = "0.1.0"
description = "Codebase concierge — chat UI powered by Claude Agent SDK"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.2.134",
    "fastapi>=0.141.1",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.4.2",
    "python-dotenv>=1.2.2",
    "ragas>=0.4.3",
    "uvicorn[standard]>=0.52.1",
]

[[tool.uv.index]]
url = "https://sstp.jfrog.io/artifactory/api/pypi/pypi/simple"
default = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
